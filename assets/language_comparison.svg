<svg id="language-comparison-chart" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="language-title language-desc"><title id="language-title">Held-out multilingual accuracy by language</title><desc id="language-desc">Grouped Jev and Qwen3.5 9B accuracy bars for six languages; each bar is one accuracy score.</desc><rect width="1280" height="720" fill="#0e1117"/><style>#language-comparison-chart text{font-family:system-ui,sans-serif;fill:#e6e9f2;font-size:20px}#language-comparison-chart .grid{stroke:#384052}#language-comparison-chart .axis{fill:#9aa2b6;font-size:17px}#language-comparison-chart .bar{stroke:none}</style><line class="grid" x1="100" y1="605.0" x2="1210" y2="605.0"/><text class="axis" x="86" y="611.0" text-anchor="end">0%</text><line class="grid" x1="100" y1="498.0" x2="1210" y2="498.0"/><text class="axis" x="86" y="504.0" text-anchor="end">20%</text><line class="grid" x1="100" y1="391.0" x2="1210" y2="391.0"/><text class="axis" x="86" y="397.0" text-anchor="end">40%</text><line class="grid" x1="100" y1="284.0" x2="1210" y2="284.0"/><text class="axis" x="86" y="290.0" text-anchor="end">60%</text><line class="grid" x1="100" y1="177.0" x2="1210" y2="177.0"/><text class="axis" x="86" y="183.0" text-anchor="end">80%</text><line class="grid" x1="100" y1="70.0" x2="1210" y2="70.0"/><text class="axis" x="86" y="76.0" text-anchor="end">100%</text><rect class="bar" data-language="English" data-model="Jev" x="123.5" y="136.7" width="60.0" height="468.3" fill="#38e1c8" role="img" aria-label="English Jev accuracy 87.54 percent"/><text x="153.5" y="126.7" text-anchor="middle">87.54%</text><rect class="bar" data-language="English" data-model="Qwen3.5 9B" x="201.5" y="159.6" width="60.0" height="445.4" fill="#9b8cff" role="img" aria-label="English Qwen3.5 9B accuracy 83.25 percent"/><text x="231.5" y="149.6" text-anchor="middle">83.25%</text><text x="192.5" y="643" text-anchor="middle">English</text><rect class="bar" data-language="Arabic" data-model="Jev" x="308.5" y="182.8" width="60.0" height="422.2" fill="#38e1c8" role="img" aria-label="Arabic Jev accuracy 78.92 percent"/><text x="338.5" y="172.8" text-anchor="middle">78.92%</text><rect class="bar" data-language="Arabic" data-model="Qwen3.5 9B" x="386.5" y="217.3" width="60.0" height="387.7" fill="#9b8cff" role="img" aria-label="Arabic Qwen3.5 9B accuracy 72.46 percent"/><text x="416.5" y="207.3" text-anchor="middle">72.46%</text><text x="377.5" y="643" text-anchor="middle">Arabic</text><rect class="bar" data-language="Chinese" data-model="Jev" x="493.5" y="191.0" width="60.0" height="414.0" fill="#38e1c8" role="img" aria-label="Chinese Jev accuracy 77.38 percent"/><text x="523.5" y="181.0" text-anchor="middle">77.38%</text><rect class="bar" data-language="Chinese" data-model="Qwen3.5 9B" x="571.5" y="223.6" width="60.0" height="381.4" fill="#9b8cff" role="img" aria-label="Chinese Qwen3.5 9B accuracy 71.29 percent"/><text x="601.5" y="213.6" text-anchor="middle">71.29%</text><text x="562.5" y="643" text-anchor="middle">Chinese</text><rect class="bar" data-language="German" data-model="Jev" x="678.5" y="175.0" width="60.0" height="430.0" fill="#38e1c8" role="img" aria-label="German Jev accuracy 80.38 percent"/><text x="708.5" y="165.0" text-anchor="middle">80.38%</text><rect class="bar" data-language="German" data-model="Qwen3.5 9B" x="756.5" y="215.6" width="60.0" height="389.4" fill="#9b8cff" role="img" aria-label="German Qwen3.5 9B accuracy 72.79 percent"/><text x="786.5" y="205.6" text-anchor="middle">72.79%</text><text x="747.5" y="643" text-anchor="middle">German</text><rect class="bar" data-language="Russian" data-model="Jev" x="863.5" y="190.4" width="60.0" height="414.6" fill="#38e1c8" role="img" aria-label="Russian Jev accuracy 77.50 percent"/><text x="893.5" y="180.4" text-anchor="middle">77.50%</text><rect class="bar" data-language="Russian" data-model="Qwen3.5 9B" x="941.5" y="221.8" width="60.0" height="383.2" fill="#9b8cff" role="img" aria-label="Russian Qwen3.5 9B accuracy 71.62 percent"/><text x="971.5" y="211.8" text-anchor="middle">71.62%</text><text x="932.5" y="643" text-anchor="middle">Russian</text><rect class="bar" data-language="Spanish" data-model="Jev" x="1048.5" y="164.3" width="60.0" height="440.7" fill="#38e1c8" role="img" aria-label="Spanish Jev accuracy 82.38 percent"/><text x="1078.5" y="154.3" text-anchor="middle">82.38%</text><rect class="bar" data-language="Spanish" data-model="Qwen3.5 9B" x="1126.5" y="196.4" width="60.0" height="408.6" fill="#9b8cff" role="img" aria-label="Spanish Qwen3.5 9B accuracy 76.38 percent"/><text x="1156.5" y="186.4" text-anchor="middle">76.38%</text><text x="1117.5" y="643" text-anchor="middle">Spanish</text><text class="axis" x="20" y="337.5" transform="rotate(-90 20 337.5)" text-anchor="middle">Accuracy (%)</text><rect x="460.0" y="668" width="14" height="14" fill="#38e1c8"/><text x="482.0" y="681">Jev</text><rect x="650.0" y="668" width="14" height="14" fill="#9b8cff"/><text x="672.0" y="681">Qwen3.5 9B (reasoning off)</text></svg>