<svg id="language-comparison-chart" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 650" role="img" aria-labelledby="language-title language-desc"><title id="language-title">Held-out multilingual accuracy</title><desc id="language-desc">Paired Jev and Qwen3.5 9B accuracy dots connected within each language. Languages are not connected to one another.</desc><rect width="1280" height="650" fill="#0e1117"/><style>#language-comparison-chart text{font-family:system-ui,sans-serif;font-size:20px;fill:#e6e9f2}#language-comparison-chart .grid{stroke:#384052}#language-comparison-chart .line{stroke:#687086;stroke-width:3}#language-comparison-chart .dot{stroke:none}#language-comparison-chart .axis{fill:#9aa2b6;font-size:16px}#language-comparison-chart .score{font-size:17px;font-weight:600}</style><line class="grid" x1="190.0" y1="55" x2="190.0" y2="560"/><text class="axis" x="190.0" y="590" text-anchor="middle">0%</text><line class="grid" x1="390.0" y1="55" x2="390.0" y2="560"/><text class="axis" x="390.0" y="590" text-anchor="middle">20%</text><line class="grid" x1="590.0" y1="55" x2="590.0" y2="560"/><text class="axis" x="590.0" y="590" text-anchor="middle">40%</text><line class="grid" x1="790.0" y1="55" x2="790.0" y2="560"/><text class="axis" x="790.0" y="590" text-anchor="middle">60%</text><line class="grid" x1="990.0" y1="55" x2="990.0" y2="560"/><text class="axis" x="990.0" y="590" text-anchor="middle">80%</text><line class="grid" x1="1190.0" y1="55" x2="1190.0" y2="560"/><text class="axis" x="1190.0" y="590" text-anchor="middle">100%</text><text x="165" y="76" text-anchor="end">English</text><line class="line" x1="1022.5" y1="70" x2="1065.4" y2="70"/><g tabindex="0" aria-label="English: Jev 87.54 percent, Qwen 83.25 percent"><circle class="dot" fill="#9b8cff" cx="1022.5" cy="70" r="8"/><circle class="dot" fill="#38e1c8" cx="1065.4" cy="70" r="8"/><text class="score" x="1079.4" y="76">87.54%</text><text class="score" x="1008.5" y="76" text-anchor="end">83.25%</text><