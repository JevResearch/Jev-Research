[project]
name = "jev-observatory"
version = "0.0.1"
description = "Offline-first experimental harness for studying TypeSafe AI's Jev endpoint (design/research only)."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.12,<3",
    "httpx>=0.28,<1",
    "typer>=0.16,<1",
    "pyarrow>=20",
    "fastapi>=0.115",
]

[project.optional-dependencies]
dev = ["pytest>=9"]
web = ["uvicorn>=0.30"]

[project.scripts]
jevo = "jev_observatory.cli:app"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
